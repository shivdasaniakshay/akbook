# Claude Code responds to "@claude" in issues and PR comments: it implements the
# request on a branch, then this workflow opens the pull request so the site's
# "Ask Claude" panel can show a preview and a Deploy button.
name: Claude
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.issue.body, '@claude') || contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use this instead of the API key if you'd rather bill your Claude Pro/Max subscription:
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash(npm install),Bash(npm run build),Bash(npm ci)"'
      - name: Open pull request
        if: github.event_name == 'issues' && steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
            --title "$TITLE" --body "Closes #$ISSUE — built by Claude from the request in the app." || true
